name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test engine
        run: cargo test -p procraft-engine
      - name: Check formatting
        run: cargo fmt --check
      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings
      # rfd-shim is excluded from the workspace, so the step above never
      # lints it; the mobile builds do compile it. Lint it explicitly.
      - name: Clippy rfd-shim (excluded crate)
        run: cargo clippy --manifest-path crates/rfd-shim/Cargo.toml --target aarch64-linux-android --all-targets -- -D warnings
      - name: Build app
        run: cargo build -p procraft
      - name: Check Android targets (no NDK link needed)
        run: |
          cargo check -p procraft --target aarch64-linux-android
          cargo check -p procraft --target x86_64-linux-android

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p procraft
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/procraft.exe dist/
          Copy-Item README.md, LICENSE-MIT dist/
          Compress-Archive -Path dist/procraft.exe, dist/README.md, dist/LICENSE-MIT `
            -DestinationPath "procraft-${{ github.ref_name }}-windows-x64.zip" -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: procraft-*.zip
          generate_release_notes: true
