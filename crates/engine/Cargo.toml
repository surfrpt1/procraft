[package]
name = "procraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Layered raster document model and brush engine for ProCraft (no GUI)"

[dependencies]
image = "0.25"
flate2 = "1"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
plist = "1"
# Pinned exact: open_psd works around two inverted flag reads in 0.3.5
# (visible bit, clipping byte); re-verify against real files on any bump.
psd = "=0.3.5"
